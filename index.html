<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.p h2{margin:0 0 8px;color:#ffe66d}

button:hover{background:#5a6988}button.s{border-color:#ffe66d}button:disabled{opacity:.4;cursor:default}
input[type=range]{width:130px;vertical-align:middle}
input[type=text]{font:inherit;background:#111;color:#fff;border:2px solid #8b9bb4;padding:3px;width:140px}
.sw{display:inline-block;width:20px;height:20px;border:2px solid #555;margin:2px;cursor:pointer}.sw.s{border-color:#fff}
.r{margin:6px 0}
#w{container-type:inline-size}
body,button,input{font-family:'Press Start 2P',monospace}
#ui{overflow:auto;background:rgba(8,10,28,.8);backdrop-filter:blur(3px)}
.p{background:linear-gradient(#2b3150,#1d2138);border:3px solid #ffe66d;box-shadow:0 0 0 3px #0c0e1c,0 10px 30px #000a;padding:2.2cqw 2.6cqw;font-size:max(8px,1.4cqw);line-height:1.7}
.p h2{font-size:max(11px,2.3cqw);letter-spacing:1px;text-shadow:2px 2px #000;margin:0 0 1.5cqw}
button{font-size:max(8px,1.4cqw);background:#3a4466;border:2px solid #0c0e1c;box-shadow:inset 0 -3px #252b45,inset 0 2px #5a6a99;padding:.9cqw 1.4cqw;transition:transform .08s}
button:hover{background:#4e5d8c;transform:translateY(-1px)}

button.s{background:#e6a817;color:#1a1c2c;box-shadow:inset 0 -3px #a8740c,inset 0 2px #ffe08a}

input[type=text]{background:#0c0e1c;border:2px solid #5a6a99;color:#fff;padding:.8cqw;font-size:max(8px,1.3cqw)}

.mm{display:flex;flex-direction:column;width:100%;height:100%;padding:3cqw 4cqw;box-sizing:border-box}
.mm h1{margin:0;font-size:max(18px,6.2cqw);color:#ffe66d;text-shadow:.5cqw .5cqw #b13e53,1cqw 1cqw #000;line-height:1.1;font-weight:normal}
.mm h1 small{display:block;font-size:.2em;color:#9ad1ff;text-shadow:2px 2px #000;margin-top:1.4cqw;letter-spacing:.2cqw}
.cols{display:flex;gap:3cqw;margin-top:3cqw;flex:1;min-height:0}

.card{background:#1d2138cc;border:3px solid #3a4466;padding:1.6cqw;width:19cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;align-self:flex-start}
.card input{width:100%;box-sizing:border-box;text-align:center}
.card button{margin:0}

</style></head><body><div id="w"><canvas id="c"></canvas><div id="ui"></div></div>
<script>
const W=320,H=180,T=16,MW=110,MH=80;
const c=document.getElementById('c'),g=c.getContext('2d'),ui=document.getElementById('ui');
c.width=W;c.height=H;g.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const hash=(x,y)=>{let h=(x*374761393+y*668265263)>>>0;h=((h^(h>>>13))*1274126177)>>>0;return((h^(h>>>16))&255)/255};
// ---------- datos guardados ----------
let S={sens:1,mus:.5,sfx:.6},V={coins:0,owned:[0],eq:0,arm:-1,armo:[],pet:-1,peto:[],srv:'',room:'',av:{skin:'#f2c18d',hair:'#5a3a22',shirt:'#3b82f6',acc:0,name:'Jugador'}};
try{Object.assign(S,JSON.parse(localStorage.getItem('ps_s')||'{}'));Object.assign(V,JSON.parse(localStorage.getItem('ps_v')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ps_s',JSON.stringify(S));localStorage.setItem('ps_v',JSON.stringify(V))}catch(e){}};
setInterval(save,5000);
// ---------- armas y enemigos ----------
const WP=[{n:'Pistola',d:1,cd:.26,s:240,pel:1,sp:.05,pr:0,col:'#ffe66d'},
{n:'Subfusil',d:1,cd:.09,s:260,pel:1,sp:.16,pr:60,col:'#ff9d3d'},
{n:'Escopeta',d:1,cd:.65,s:230,pel:5,sp:.38,pr:120,col:'#ff6b6b'},
{n:'Rifle',d:4,cd:.5,s:380,pel:1,sp:.01,pr:220,col:'#7df9ff'},
{n:'Cañón láser',d:3,cd:.12,s:420,pel:1,sp:.03,pr:400,col:'#c77dff'}];
const EN=[{hp:2,sp:28,c:[1,2],w:0,r:6,cy:5},{hp:1,sp:62,c:[1,1],w:2,r:5,cy:8},{hp:4,sp:34,c:[1,3],w:3,r:5,cy:9},
{hp:3,sp:30,c:[2,4],w:4,r:5,cy:9,nc:1},{hp:10,sp:18,c:[4,8],w:5,r:9,cy:12},{hp:60,sp:22,c:[30,40],w:99,r:15,cy:10}];
const ARM=[{n:'Cuero',a:1,pr:70,col:'#a0642d'},{n:'Malla',a:2,pr:180,col:'#b8c0cc'},{n:'Placa',a:3,pr:350,col:'#e8edf5'}];
const PETS=[{n:'Perrito',pr:150,d:'Atrae monedas de lejos'},{n:'Búho',pr:260,d:'Dispara a enemigos cercanos'},{n:'Hada',pr:380,d:'Cura 1 corazón cada 25 s'}];
const MT=[{k:'kill',ty:0,n:8,t:'Matá 8 slimes'},{k:'kill',ty:1,n:6,t:'Matá 6 murciélagos'},{k:'kill',ty:2,n:5,t:'Matá 5 esqueletos'},{k:'kill',ty:3,n:4,t:'Matá 4 fantasmas'},{k:'any',n:12,t:'Matá 12 enemigos'},{k:'coin',n:25,t:'Juntá 25 monedas'},{k:'streak',n:8,t:'Matá 8 sin recibir daño'},{k:'time',n:45,t:'Sobreviví 45 segundos'}];
const goal=()=>12+8*lvl,cap=()=>Math.min(36,9+Math.floor(diff()*2.5))+(net.on?Object.keys(net.rem).length*3:0);
// ---------- mapa ----------
const PAL=[{a:'#3e8948',b:'#4a9a52',t:'#63ab3f',tr:'#2d6a3e',tl:'#4aa35a',w:'#2f6bd1',wl:'#5b9cf0'},
{a:'#d9b36c',b:'#cfa75e',t:'#b88a3e',tr:'#5a8a3a',tl:'#7fb04a',w:'#2aa6a6',wl:'#6fd6d0'},
{a:'#dfe9f2',b:'#cfdceb',t:'#a8bdd6',tr:'#2a5a5a',tl:'#4a8a8a',w:'#4a6fa5',wl:'#8fb3e0'}];
const m=new Uint8Array(MW*MH);let pal=PAL[0];
function genMap(sd,pi){pal=PAL[pi];
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const ed=x<1||y<1||x>=MW-1||y>=MH-1;m[y*MW+x]=ed||hash(x+sd*97,y+sd*53)<.07?1:0}
 for(let i=0;i<16;i++){const cx=6+hash(i+sd*13,99)*(MW-12),cy=6+hash(i+sd*13,77)*(MH-12),rx=2+hash(i,5+sd)*3,ry=2+hash(i,6+sd)*2.5;
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(((x-cx)/rx)**2+((y-cy)/ry)**2<1)m[y*MW+x]=2}
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(Math.hypot(x-MW/2,y-MH/2)<4)m[y*MW+x]=0}
const tile=(px,py)=>{const x=Math.floor(px/T),y=Math.floor(py/T);return x<0||y<0||x>=MW||y>=MH?1:m[y*MW+x]};
const hit4=(x,y,r)=>[[-r,-r],[r,-r],[-r,r],[r,r]].some(([a,b])=>tile(x+a,y+b)!==0);
const move=(e,dx,dy,r)=>{if(!hit4(e.x+dx,e.y,r))e.x+=dx;if(!hit4(e.x,e.y+dy,r))e.y+=dy};
// ---------- audio ----------
let AC,mg,sg;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();mg.connect(AC.destination);sg.connect(AC.destination);vol();music()}catch(e){AC=null}}
function vol(){if(AC){mg.gain.value=S.mus*.3;sg.gain.value=S.sfx*.5}}
function tone(ty,f,f2,d,v,dest){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(dest);o.start(n);o.stop(n+d)}
const sShot=()=>{const f=[320,420,200,520,680][V.eq];tone(V.eq==4?'sawtooth':'square',f,f*.35,.07,.2,sg)};
const sHit=()=>tone('triangle',220,90,.06,.3,sg),sKill=()=>tone('square',300,650,.1,.18,sg),sCoin=()=>tone('square',880,1320,.07,.12,sg),sHurt=()=>tone('sawtooth',150,50,.2,.25,sg);
function music(){const lead=[0,2,4,2,5,4,2,0,0,2,4,7,5,4,2,-1],sc=[220,261.6,293.7,329.6,392,440,523.3,587.3],bs=[110,87.3,98,82.4];let st=0,nx=AC.currentTime+.1;
 setInterval(()=>{while(nx<AC.currentTime+.3){const bar=Math.floor(st/8)%4,i=lead[(st+bar*3)%16];
  if(i>=0)tone('square',sc[i],sc[i],.2,.4,mg);if(st%4==0)tone('triangle',bs[bar],bs[bar],.5,.9,mg);st++;nx+=.22}},100)}
// ---------- estado ----------
let state='menu',mode='surv',lvl=1,t=0,paused=false,p,bullets=[],enemies=[],hearts=[],coins=[],parts=[],nums=[],kills=0,spawnT=1,nid=1,camx=0,camy=0,boss=null,bd=false,pet=null,ms=null,bn={s:'',l:0},ret=()=>main(),best=0;
const keys={},net={on:false,id:0,host:false,rem:{},ws:null,mode:'surv'};
let mx=W/2,my=H/2,mdown=false,stick=null,stickId=null,aimId=null;
const snd=o=>{if(net.on&&net.ws&&net.ws.readyState===1)net.ws.send(JSON.stringify(o))};
const myId=()=>net.on?net.id:0,isHost=()=>!net.on||net.host,diff=()=>mode==='camp'?lvl*1.6:1+Math.floor(kills/10);
function start(md,lv){mode=md;lvl=lv||1;genMap(md==='camp'?lvl*7:3,md==='camp'?[0,0,1,1,2][lvl-1]:0);
 p={ar:ARM[V.arm]?ARM[V.arm].a:0,x:MW*T/2,y:MH*T/2,hp:5,cd:0,inv:0,ang:0,walk:0,moving:false,kick:0,dead:0};
 bullets=[];enemies=[];hearts=[];coins=[];parts=[];nums=[];kills=0;spawnT=1;boss=null;bd=false;state='play';paused=false;close();pet=null;ms=mode==='camp'?newMission([0,5,6,3,7][lvl-1]):newMission();banner(mode==='camp'?'NIVEL '+lvl:'SUPERVIVENCIA')}
function mk(k,x,y){const d=EN[k],hp=d.hp+(k<5?Math.floor(diff()/3):0),e={id:nid++,k,x,y,hp,mx:hp,ph:Math.random()*6,fl:0,hb:0};enemies.push(e);return e}
function spawn(k){for(let i=0;i<12;i++){const a=Math.random()*6.283,d=150+Math.random()*40,x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;
 if(tile(x,y)===0||(EN[k].nc&&tile(x,y)!==1&&x>0&&y>0&&x<MW*T&&y<MH*T))return mk(k,x,y)}}
function pick(){const d=diff(),pool=[];EN.forEach((e,i)=>{if(i<5&&e.w<=d){pool.push(i);if(i<2)pool.push(i)}});return pool[Math.floor(Math.random()*pool.length)]}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=20+Math.random()*50;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.3,col})}}
const num=(x,y,s,col)=>nums.push({x,y,s,c:col,l:.7});
function coinFx(x,y,n){for(let i=0;i<n;i++)coins.push({x,y,vx:rnd(-45,45),vy:rnd(-45,45)})}
function hurt(){missionEvent('hurt');if(p.ar>0)p.ar--;else p.hp--;p.inv=1;burst(p.x,p.y-6,'#e43b44',8);sHurt();if(p.hp<=0){if(net.on)p.dead=4;else{state='over';best=Math.max(best,kills);save();over()}}}
function hit(e,d){if(net.on&&!net.host){snd({t:'h',id:e.id,d});e.hp=Math.max(.1,e.hp-d);e.fl=.12;e.hb=1.6;num(e.x,e.y-EN[e.k].cy-8,'-'+d,'#fff');sHit()}else dmg(e,d,myId())}
function dmg(e,d,own){const q=EN[e.k];e.hp-=d;e.fl=.12;e.hb=1.6;num(e.x,e.y-q.cy-8,'-'+d,'#fff');sHit();burst(e.x,e.y-q.cy,'#ff5a5a',3);
 if(e.hp<=0&&!e.dead){e.dead=true;kills++;if(own===myId())missionEvent('kill',e.k);sKill();burst(e.x,e.y-q.cy,'#ffffff',10);const n=rnd(q.c[0],q.c[1]);if(e.k===5){bd=true;boss=null}
  if(own===myId())coinFx(e.x,e.y,n);else snd({t:'c',to:own,n,k:e.k,x:e.x,y:e.y});
  if(Math.random()<.12)hearts.push({x:e.x,y:e.y})}}
function shoot(){const w=WP[V.eq];p.cd=w.cd;p.kick=2;
 for(let i=0;i<w.pel;i++){const a=p.ang+(Math.random()-.5)*w.sp,vx=Math.cos(a)*w.s,vy=Math.sin(a)*w.s,x=p.x+Math.cos(p.ang)*9,y=p.y-6+Math.sin(p.ang)*9,l=w.pel>1?.35:1.1;
  bullets.push({x,y,vx,vy,l,d:w.d,col:w.col});snd({t:'s',x,y,vx,vy,l,col:w.col})}
 burst(p.x+Math.cos(p.ang)*10,p.y-6+Math.sin(p.ang)*10,w.col,2);sShot()}
function update(dt){
 t+=dt;bn.l-=dt;if(state!=='play'||(paused&&!net.on))return;
 const host=isHost();
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(stick){dx=stick.x;dy=stick.y}
 const l=Math.hypot(dx,dy);p.moving=l>.1&&!p.dead&&!paused;
 if(p.moving){const s=75*dt/Math.max(1,l);move(p,dx*s,dy*s,4);p.walk+=dt*10}
 p.ang=Math.atan2(my+camy-(p.y-6),mx+camx-p.x);
 p.cd-=dt;p.inv-=dt;p.kick=Math.max(0,p.kick-dt*40);
 if(p.dead>0){p.dead-=dt;if(p.dead<=0){p.dead=0;p.hp=5;p.inv=2}}
 else if(!paused&&(mdown||keys[' '])&&p.cd<=0)shoot();
 if(host){spawnT-=dt;if(spawnT<=0){if(enemies.length<cap())spawn(pick());spawnT=Math.max(.45,1.7-diff()*.09)}
  if(mode==='camp'&&lvl===5&&!boss&&!bd)boss=spawn(5)||null}
 const sm=Math.min(1.5,1+diff()*.03);
 for(const e of enemies){const d=EN[e.k];e.fl-=dt;e.hb-=dt;
  if(!host){e.x+=(e.tx-e.x)*Math.min(1,dt*12);e.y+=(e.tz-e.y)*Math.min(1,dt*12)}
  else{let tg=p;if(net.on)for(const r of Object.values(net.rem))if(Math.hypot(r.x-e.x,r.y-e.y)<Math.hypot(tg.x-e.x,tg.y-e.y))tg=r;
   const a=Math.atan2(tg.y-e.y,tg.x-e.x),s=d.sp*dt*sm*(1+Math.sin(t*6+e.ph)*.4);
   if(d.nc){e.x+=Math.cos(a)*s;e.y+=Math.sin(a)*s}else move(e,Math.cos(a)*s,Math.sin(a)*s,e.k==5?6:4)}
  if(!p.dead&&p.inv<=0&&Math.hypot(p.x-e.x,p.y-e.y)<d.r+4)hurt()}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  if(tile(b.x,b.y)===1){b.l=0;burst(b.x,b.y,'#9ad17a',3);continue}
  for(const e of enemies){const d=EN[e.k];if(b.l>0&&!e.dead&&Math.hypot(b.x-e.x,b.y-(e.y-d.cy))<d.r+2){b.l=0;if(!b.rm)hit(e,b.d);burst(b.x,b.y,'#ff5a5a',2)}}}
 bullets=bullets.filter(b=>b.l>0);enemies=enemies.filter(e=>!e.dead);
 hearts=hearts.filter(h=>{if(Math.hypot(h.x-p.x,h.y-p.y)<10){p.hp=Math.min(5,p.hp+1);return false}return true});
 for(const q of coins){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;const d=Math.hypot(p.x-q.x,p.y-6-q.y);
  if(d<(pet&&pet.ty===0?90:45)){q.x+=(p.x-q.x)*dt*6;q.y+=(p.y-6-q.y)*dt*6}if(d<7){q.got=1;V.coins++;missionEvent('coin');sCoin()}}
 coins=coins.filter(q=>!q.got);
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 for(const n of nums){n.y-=dt*14;n.l-=dt}nums=nums.filter(n=>n.l>0);missionTick(dt);petTick(dt);
 if(mode==='camp'&&host&&((lvl<5&&kills>=goal())||(lvl===5&&bd))){V.coins+=lvl*10;save();if(net.on&&lvl<5)start('camp',lvl+1);else{state='clear';if(net.on)snd({t:'win'});clearMenu()}}
 if(net.on){net.pt=(net.pt||0)-dt;if(net.pt<=0){net.pt=.066;snd({t:'p',x:p.x,y:p.y,a:p.ang,n:V.av.name,av:V.av,ar:V.arm})}
  if(net.host){net.et=(net.et||0)-dt;if(net.et<=0){net.et=.1;snd({t:'e',k:kills,lv:lvl,l:enemies.map(e=>[e.id,e.k,Math.round(e.x),Math.round(e.y),e.hp,e.mx])})}}
  for(const id in net.rem){const r=net.rem[id],k=Math.min(1,dt*12),mv=Math.hypot(r.tx-r.x,r.ty-r.y)>.5;r.moving=mv;if(mv)r.walk+=dt*10;r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;if(t-r.lt>6)delete net.rem[id]}}
}
// ---------- red ----------
function onNet(d){
 if(d.t==='p'){const r=net.rem[d.from]||(net.rem[d.from]={x:d.x,y:d.y,walk:0,moving:false,kick:0});r.tx=d.x;r.ty=d.y;r.ang=d.a;r.av=d.av;r.name=d.n;r.arm=d.ar;r.lt=t}
 else if(d.t==='s')bullets.push({x:d.x,y:d.y,vx:d.vx,vy:d.vy,l:d.l,d:0,rm:1,col:d.col});
